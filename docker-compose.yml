version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: vbote
      POSTGRES_PASSWORD: vbote
      POSTGRES_DB: vbote
    volumes:
      - vbote_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbote -d vbote"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vbote
      SPRING_DATASOURCE_USERNAME: vbote
      SPRING_DATASOURCE_PASSWORD: vbote
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: never
    depends_on:
      - db

volumes:
  vbote_db_data:
