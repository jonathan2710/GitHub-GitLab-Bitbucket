spring.application.name=vbote
server.port=8080

# H2 Database Configuration (File-Based - Persistent)
# Stores data in user home directory: ~/vbote_data/testdb.mv.db
# AUTO_SERVER=TRUE allows auto-start of server if needed
spring.datasource.url=jdbc:h2:file:~/vbote_data/testdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=10;DB_CLOSE_ON_EXIT=TRUE;TRACE_LEVEL_SYSTEM_OUT=3
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Defer datasource initialization (ensure schema created before data loads)
spring.jpa.defer-datasource-initialization=true
# SQL script initialization - disabled because DataInitializer handles seeding
spring.sql.init.mode=never
# Don't run schema.sql here (Hibernate will create schema in-memory)
# no explicit schema script; Hibernate will create schema (data.sql runs after)

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.vbote=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
